<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optmiza Compras</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/2611181 (1).png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body style="margin: 0; padding: 0; overflow: hidden;">
    <div class="app-layout" style="display: flex; width: 100vw; height: 100vh; overflow: hidden;">
        <!-- Sidebar -->
        <aside class="sidebar" style="height: 100vh; display: flex; flex-direction: column; box-sizing: border-box; margin: 0;">
            <button class="mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="menu-principal" onclick="toggleMobileMenu()">
                <span class="mobile-menu-icon" aria-hidden="true">☰</span>
                <span>Menu</span>
            </button>
            <button class="sidebar-collapse-toggle" type="button" onclick="toggleSidebar()" aria-label="Recolher menu" title="Recolher menu">
                <span aria-hidden="true">‹</span><span class="sidebar-collapse-label">Recolher menu</span>
            </button>
            
            <div class="brand">
                <!-- Ícone em PNG para quando o menu estiver recolhido -->
                <img src="{{ url_for('static', filename='img/2611181 (1).png') }}" alt="Optmiza" class="brand-mark collapsed-only">
                
                <!-- Logo completa em SVG para quando o menu estiver aberto -->
                <div class="logo full-logo">
                    <svg viewBox="-4 10.6 302.44 81.8" role="img" aria-label="Optmiza">
                        <circle cx="30.2" cy="44.8" r="22.5" fill="none" stroke="#38BDF8" stroke-width="7.4" stroke-linecap="round" stroke-dasharray="113.1 28.27"/>

                    </svg>
                    <span class="badge">COMPRAS</span>
                </div>
            </div>
            
            <nav id="menu-principal" class="nav-menu">
                <a class="nav-item active" id="nav-dashboard" onclick="switchView('dashboard', this)">Dashboard</a>
                <a class="nav-item" id="nav-solicitacoes" onclick="switchView('solicitacoes', this)">Solicitações de Compra</a>
                <a class="nav-item" id="nav-comercial" data-perm="comercial" onclick="switchView('comercial', this); carregarPedidosComerciais()">Comercial</a>
                <a class="nav-item" id="nav-itens" onclick="switchView('itens', this)">Cadastro de Itens</a>
                <a class="nav-item" id="nav-pedidos" onclick="switchView('pedidos', this)">Pedidos (PO)</a>
                <a class="nav-item" id="nav-fornecedores" onclick="switchView('fornecedores', this)">Fornecedores</a>
                <a class="nav-item" id="nav-mrp" onclick="switchView('mrp', this)">Planejamento MRP</a>
                <a class="nav-item" id="nav-rotas" onclick="switchView('rotas', this)">Rotas do Motorista</a>
                <a class="nav-item" id="nav-precos" data-perm="precos" onclick="switchView('precos', this); carregarPrecos()">Formação de Preços</a>
                <a class="nav-item" id="nav-usuarios" onclick="switchView('usuarios', this)" style="display:none;">Gerenciar Usuários</a>
            </nav>

            <button class="agenda-sidebar-toggle" type="button" onclick="toggleAgenda()" aria-label="Abrir agenda" aria-expanded="false" title="Abrir agenda">
                <span aria-hidden="true">&#128197;</span><span>Minha agenda</span>
            </button>

            <div style="padding: 15px; border-top: 1px solid var(--border-color); background-color: var(--surface-color); display: flex; flex-direction: column; gap: 8px; margin-top: auto;">
                <button class="btn btn-outline" onclick="openModalAlterarSenha()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem;">
                    <span>🔑</span> <span>Alterar senha</span>
                </button>
                <button class="btn btn-outline" onclick="toggleTheme()" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.8rem;">
                    <span id="theme-icon">🌙</span> <span id="theme-text">Modo Escuro</span>
                </button>
                <a href="{{ url_for('auth.logout') }}" class="btn" style="background-color: var(--danger-color); color: white; text-decoration: none; text-align: center; justify-content: center; font-size: 0.8rem; border: none; display: flex; align-items: center;">
                    🚪 Sair do Sistema
                </a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content" style="flex: 1; height: 100vh; overflow-y: auto; padding: 25px; background-color: var(--bg-color); box-sizing: border-box;">
            {% block content %}{% endblock %}
            <footer class="system-footer">
                Desenvolvido por Pedro Marinho. Um produto Optmiza.
            </footer>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js', v='38') }}"></script>
</body>
</html>
